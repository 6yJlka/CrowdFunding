<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>RiseUp — каталог проектов</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#C6F24E}a:hover{color:#E2FF8A}
</style>
</helmet>
<div style="font-family: 'Manrope', system-ui, sans-serif; background: #0E0E10; color: #F4F4F0; min-height: 100vh">

  <header style="max-width: 1200px; margin: 0 auto; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
    <a href="Bold.dc.html" style="font-family: 'Unbounded', sans-serif; font-weight: 900; font-size: 22px; color: #F4F4F0; text-decoration: none; display: flex; align-items: center; gap: 10px">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><circle cx="15" cy="15" r="15" fill="#C6F24E"></circle><path d="M8 19l7-8 7 8" fill="none" stroke="#0E0E10" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      RISEUP
    </a>
    <nav aria-label="Основная навигация" style="display: flex; flex-wrap: wrap; gap: 6px; padding: 6px; border-radius: 999px; background: #1C1C20">
      <a href="Catalog.dc.html" aria-current="page" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 999px; background: #F4F4F0; color: #0E0E10; text-decoration: none; font-weight: 700; font-size: 15px">Проекты</a>
      <a href="#how" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 999px; color: #F4F4F0; text-decoration: none; font-weight: 600; font-size: 15px">Как это работает</a>
      <a href="Analytics.dc.html" style="display: inline-flex; align-items: center; min-height: 40px; padding: 0 16px; border-radius: 999px; color: #F4F4F0; text-decoration: none; font-weight: 600; font-size: 15px">Аналитика</a>
    </nav>
    <div style="display: flex; gap: 8px">
      <a href="Auth.dc.html" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 20px; border-radius: 999px; border: 1.5px solid #3A3A40; color: #F4F4F0; text-decoration: none; font-weight: 700">Войти</a>
      <a href="#create" style="display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px; background: #C6F24E; color: #0E0E10; text-decoration: none; font-weight: 800">Запустить</a>
    </div>
  </header>

  <section style="max-width: 1200px; margin: 0 auto; padding: 32px 24px 24px; display: flex; flex-direction: column; gap: 24px">
    <h1 style="margin: 0; font-family: 'Unbounded', sans-serif; font-size: clamp(36px, 5.6vw, 72px); line-height: 1; font-weight: 900; text-transform: uppercase">Каталог проектов</h1>
    <div style="display: flex; flex-wrap: wrap; gap: 10px; align-items: center">
      <form role="search" onSubmit="{{noop}}" style="flex: 1 1 420px; display: flex; gap: 8px; padding: 6px; border-radius: 999px; background: #1C1C20">
        <label for="c-search" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Найти проект по названию</label>
        <input id="c-search" type="search" placeholder="Найти проект по названию" style="flex: 1; min-width: 0; min-height: 48px; padding: 0 18px; border: 0; outline: none; background: transparent; color: #F4F4F0; font: inherit; font-size: 16px">
        <button type="submit" style="min-height: 48px; padding: 0 22px; border-radius: 999px; border: 0; background: #C6F24E; color: #0E0E10; font: inherit; font-weight: 800; cursor: pointer">Поиск</button>
      </form>
      <div style="position: relative; flex: 0 1 auto; display: flex; align-items: center; gap: 6px; min-height: 60px; padding-left: 22px; border-radius: 999px; background: #1C1C20">
        <label for="c-sort" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Сортировка</label>
        <select id="c-sort" onChange="{{onSort}}" style="appearance: none; -webkit-appearance: none; min-height: 60px; padding: 0 52px 0 0; border: 0; border-radius: 999px; background: transparent; color: #F4F4F0; font: inherit; font-weight: 800; font-size: 15px; cursor: pointer">
          <option value="new" style="background: #1C1C20; color: #F4F4F0">Сначала новые</option>
          <option value="funded" style="background: #1C1C20; color: #F4F4F0">Больше собрано</option>
          <option value="goal" style="background: #1C1C20; color: #F4F4F0">Самая высокая цель</option>
          <option value="az" style="background: #1C1C20; color: #F4F4F0">Название А–Я</option>
        </select>
        <span aria-hidden="true" style="position: absolute; right: 8px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 50%; background: #0E0E10; display: flex; align-items: center; justify-content: center; pointer-events: none"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 5l4 4 4-4" fill="none" stroke="#C6F24E" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path></svg></span>
      </div>
    </div>
    <div role="tablist" aria-label="Статус сбора" style="display: flex; gap: 6px; padding: 6px; border-radius: 999px; background: #1C1C20; width: fit-content; max-width: 100%">
      <sc-for list="{{statuses}}" as="t" hint-placeholder-count="2">
        <button type="button" role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
      </sc-for>
    </div>
    <div role="group" aria-label="Категории" style="display: flex; flex-wrap: wrap; gap: 8px">
      <sc-for list="{{cats}}" as="c" hint-placeholder-count="8">
        <button type="button" onClick="{{c.pick}}" aria-pressed="{{c.on}}" style="{{c.style}}">{{c.label}}</button>
      </sc-for>
    </div>
    <p style="margin: 0; color: #A0A0A8; font-size: 15px">Найдено проектов: <b style="color: #F4F4F0">{{count}}</b></p>
  </section>

  <section style="max-width: 1200px; margin: 0 auto; padding: 0 24px 40px">
    <div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px">
      <sc-for list="{{projects}}" as="p" hint-placeholder-count="9">
        <a href="Project.dc.html" style="display: flex; flex-direction: column; border-radius: 28px; overflow: hidden; background: #1C1C20; color: #F4F4F0; text-decoration: none">
          <div style="height: 170px; background: {{p.color}}; position: relative">
            <span style="position: absolute; top: 14px; left: 14px; padding: 6px 12px; border-radius: 999px; background: #0E0E10; color: #F4F4F0; font-weight: 700; font-size: 13px">{{p.cat}}</span>
            <sc-if value="{{p.funded}}" hint-placeholder-val="{{ false }}">
              <span style="position: absolute; top: 14px; right: 14px; padding: 6px 12px; border-radius: 999px; background: #F4F4F0; color: #0E0E10; font-weight: 800; font-size: 13px">Цель достигнута</span>
            </sc-if>
          </div>
          <div style="padding: 20px 22px 24px; display: flex; flex-direction: column; gap: 12px; flex: 1">
            <div style="font-size: 20px; font-weight: 800; line-height: 1.2">{{p.title}}</div>
            <div style="font-size: 15px; color: #B4B4BC; line-height: 1.5; flex: 1">{{p.desc}}</div>
            <div style="height: 8px; border-radius: 999px; background: #2E2E34"><div style="width: {{p.bar}}%; height: 100%; border-radius: 999px; background: #C6F24E"></div></div>
            <div style="display: flex; justify-content: space-between; font-size: 14px; color: #A0A0A8"><span><b style="color: #F4F4F0">{{p.raisedL}}</b> из {{p.goalL}}</span><span>{{p.pct}}%</span></div>
          </div>
        </a>
      </sc-for>
    </div>
    <sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
      <div style="padding: 48px; border-radius: 28px; background: #1C1C20; text-align: center; color: #B4B4BC; font-size: 17px">Проекты не найдены.</div>
    </sc-if>
  </section>

  <nav aria-label="Страницы каталога" style="max-width: 1200px; margin: 0 auto; padding: 0 24px 64px; display: flex; align-items: center; justify-content: center; gap: 14px">
    <button type="button" disabled style="min-height: 48px; padding: 0 22px; border-radius: 999px; border: 1.5px solid #2E2E34; background: transparent; color: #6E6E76; font: inherit; font-weight: 700">Назад</button>
    <span style="color: #B4B4BC; font-weight: 700">Страница 1 из 5</span>
    <button type="button" style="min-height: 48px; padding: 0 22px; border-radius: 999px; border: 0; background: #F4F4F0; color: #0E0E10; font: inherit; font-weight: 800; cursor: pointer">Вперёд</button>
  </nav>

  <footer style="max-width: 1200px; margin: 0 auto; padding: 28px 24px 36px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px; color: #A0A0A8; font-size: 14px; border-top: 1px solid #2E2E34">
    <span>© RiseUp 2026</span>
    <nav aria-label="Ссылки в подвале" style="display: flex; flex-wrap: wrap; gap: 20px; font-weight: 600"><a href="Catalog.dc.html" style="color: #D6D6DC">Проекты</a><a href="Bold.dc.html" style="color: #D6D6DC">Как это работает</a><a href="https://github.com/6yJlka/CrowdFunding">Исходный код на GitHub</a></nav>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":1960}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cat: 'Все категории', sort: 'new', status: 'ACTIVE' }; }
  renderVals() {
    const colors = { 'Творчество': '#C6F24E', 'Технологии': '#5FD4C4', 'Образование': '#FFD23F', 'Благотворительность': '#FF6A3D', 'Социальные проекты': '#7C8CFF' };
    const all = [
      { title: 'Настольная игра «Метро 2088»', cat: 'Творчество', desc: 'Кооперативная игра на четверых про станции и туннели.', raised: 820000, goal: 900000, n: 9 },
      { title: 'Тёплый дом для приюта «Лапа»', cat: 'Благотворительность', desc: 'Утеплённые вольеры для сорока собак к зиме.', raised: 412000, goal: 600000, n: 8 },
      { title: 'Документальный фильм о Русском Севере', cat: 'Творчество', desc: 'Экспедиция по деревням Архангельской области.', raised: 245000, goal: 1000000, n: 7 },
      { title: 'Умная кормушка для птиц', cat: 'Технологии', desc: 'Камера распознаёт виды и присылает фото в Telegram.', raised: 530000, goal: 750000, n: 6 },
      { title: 'Сборник рассказов «Ночные трамваи»', cat: 'Творчество', desc: 'Двенадцать историй о городе после полуночи.', raised: 96000, goal: 150000, n: 5 },
      { title: 'Мастерская керамики в Твери', cat: 'Образование', desc: 'Гончарный круг и печь для открытых занятий.', raised: 310000, goal: 400000, n: 4 },
      { title: 'Велодорожка вдоль Яузы: проект и макет', cat: 'Социальные проекты', desc: 'Архитектурный проект и макет для обсуждения с районом.', raised: 188000, goal: 400000, n: 3 },
      { title: 'Карточная игра «Сквозняк»', cat: 'Творчество', desc: 'Быстрая дуэльная игра на 20 минут.', raised: 140000, goal: 250000, n: 2 },
      { title: 'Пиксельный рогалик «Подвал»', cat: 'Творчество', desc: 'Инди-игра про спуск в бесконечный подвал.', raised: 820000, goal: 1000000, n: 1 },
      { title: 'Металлические жетоны станций', cat: 'Творчество', desc: 'Дополнение к «Метро 2088»: 24 жетона из латуни.', raised: 310000, goal: 250000, n: 12, status: 'FUNDED' },
      { title: 'Учебник робототехники для 5 класса', cat: 'Образование', desc: 'Открытый учебник с заданиями для школьных кружков.', raised: 260000, goal: 200000, n: 11, status: 'FUNDED' },
      { title: 'Пандус для районной библиотеки', cat: 'Социальные проекты', desc: 'Чтобы в библиотеку можно было заехать на коляске.', raised: 150000, goal: 120000, n: 10, status: 'FUNDED' }
    ];
    const fmt = (n) => n.toLocaleString('ru-RU') + ' ₽';
    const names = ['Все категории', 'Благотворительность', 'Образование', 'Социальные проекты', 'Творчество', 'Технологии'];
    const cur = this.state.cat;
    const cats = names.map((n) => {
      const on = n === cur;
      return { label: n, on: on ? 'true' : 'false', pick: () => this.setState({ cat: n }),
        style: 'min-height: 44px; padding: 0 18px; border-radius: 999px; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; ' + (on ? 'background: #C6F24E; color: #0E0E10; border: 1.5px solid #C6F24E' : 'background: transparent; color: #F4F4F0; border: 1.5px solid #3A3A40') };
    });
    const s = this.state.sort;
    const st = this.state.status;
    const statuses = [['ACTIVE', 'Идёт сбор'], ['FUNDED', 'Профинансированы']].map(([k, l]) => {
      const on = k === st;
      return { label: l, on: on ? 'true' : 'false', pick: () => this.setState({ status: k }),
        style: 'min-height: 44px; padding: 0 20px; border-radius: 999px; border: 0; font: inherit; font-weight: 700; font-size: 15px; cursor: pointer; ' + (on ? 'background: #F4F4F0; color: #0E0E10' : 'background: transparent; color: #F4F4F0') };
    });
    const list = all.filter((p) => (p.status || 'ACTIVE') === st).filter((p) => cur === 'Все категории' || p.cat === cur).slice().sort((a, b) =>
      s === 'funded' ? b.raised - a.raised : s === 'goal' ? b.goal - a.goal : s === 'az' ? a.title.localeCompare(b.title, 'ru') : b.n - a.n);
    const projects = list.map((p) => {
      const pct = Math.round(p.raised / p.goal * 100);
      return { ...p, pct, bar: Math.min(pct, 100), raisedL: fmt(p.raised), goalL: fmt(p.goal), color: colors[p.cat], funded: p.status === 'FUNDED' };
    });
    return {
      cats, statuses, projects, count: cur === 'Все категории' ? (st === 'FUNDED' ? 37 : 128) : projects.length, empty: projects.length === 0,
      onSort: (e) => this.setState({ sort: e.target.value }),
      noop: (e) => e && e.preventDefault && e.preventDefault()
    };
  }
}
</script>
</body>
</html>
