services:
  db:
    image: postgres:16
    container_name: crowdfunding-db
    environment:
      POSTGRES_DB: crowdfunding
      POSTGRES_USER: crowdfunding
      POSTGRES_PASSWORD: crowdfunding
    ports:
      - "5433:5432"
    volumes:
      - crowdfunding_pgdata:/var/lib/postgresql/data

  app:
    image: 6yjlka/crowdfunding:latest
    container_name: crowdfunding-app
    depends_on:
      - db
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/crowdfunding
      SPRING_DATASOURCE_USERNAME: crowdfunding
      SPRING_DATASOURCE_PASSWORD: crowdfunding
      JAVA_OPTS: "-Xms128m -Xmx256m"

volumes:
  crowdfunding_pgdata: