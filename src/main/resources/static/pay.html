<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/assets/riseup-mark-square.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo Payment | CrowdFunding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="site-shell"></div>
<main class="create-layout">
    <section class="panel form-panel">
        <div class="panel-header">
            <div>
                <p class="panel-kicker">Demo Payment</p>
                <h3>Confirm your donation</h3>
            </div>
            <a class="ghost-btn" href="/sponsor-dashboard.html">My donations</a>
        </div>
        <div class="auth-status" id="pay-status"></div>
        <div class="project-side-note hidden" id="pay-summary"></div>
        <div class="form-actions">
            <button class="primary-btn" type="button" id="pay-success-btn">Mark as paid</button>
            <button class="ghost-btn" type="button" id="pay-fail-btn">Mark as failed</button>
        </div>
    </section>
    <aside class="panel tips-panel">
        <p class="panel-kicker">Sandbox</p>
        <h3>How this works</h3>
        <ul class="tips-list">
            <li>This page imitates an external payment provider.</li>
            <li>`Mark as paid` triggers your webhook and updates project funding.</li>
            <li>After completion you return to the project page.</li>
        </ul>
    </aside>
</main>
<script src="/i18n.js"></script>
<script src="/shell.js"></script>
<script src="/pay-app.js"></script>
</body>
</html>
