<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/assets/riseup-mark-square.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Project | CrowdFunding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="site-shell"></div>
<main class="create-layout">
    <section class="panel form-panel">
        <div class="panel-header">
            <div>
                <p class="panel-kicker">Author Flow</p>
                <h3>Edit campaign</h3>
            </div>
            <a class="ghost-btn" href="/author-dashboard.html">Back to cabinet</a>
        </div>

        <div class="auth-status" id="project-status"></div>
        <div class="project-rejection-note hidden" id="project-rejection-note"></div>

        <form class="project-form" id="project-form">
            <section class="project-cover-field">
                <div class="project-cover-preview-shell">
                    <div class="project-cover-preview" id="project-cover-preview-fallback">
                        <div class="project-cover-glow"></div>
                        <div class="project-cover-copy">
                            <strong id="project-cover-preview-title">PR</strong>
                            <span id="project-cover-preview-category">Project</span>
                        </div>
                    </div>
                    <img id="project-cover-preview-image" class="project-cover-preview-image hidden" alt="Project cover preview">
                </div>
                <label class="project-cover-upload-group">
                    <span id="project-image-label">Project image</span>
                    <input class="hidden" type="file" name="projectImage" id="project-image-input" accept="image/*">
                    <span class="project-cover-upload-box">
                        <span class="project-cover-upload-action" id="project-image-action">Choose image</span>
                        <span class="project-cover-upload-name" id="project-image-name">No file selected</span>
                    </span>
                    <small class="field-hint" id="project-image-hint">Optional. Upload a new image to replace the current one.</small>
                </label>
            </section>
            <label>
                <span id="project-title-label">Title</span>
                <input type="text" name="title" maxlength="180" required>
            </label>
            <label>
                <span id="project-short-description-label">Short description</span>
                <textarea name="shortDescription" maxlength="300" rows="3" required></textarea>
            </label>
            <label>
                <span id="project-description-label">Description</span>
                <textarea name="description" rows="7" required></textarea>
            </label>
            <div class="form-row">
                <label>
                    <span id="project-goal-label">Goal amount</span>
                    <input type="number" name="goalAmount" min="0.01" step="0.01" required>
                </label>
                <label>
                    <span id="project-currency-label">Currency</span>
                    <input type="text" name="currency" value="RUB" minlength="3" maxlength="3" required>
                </label>
            </div>
            <div class="form-row">
                <label>
                    <span id="project-category-label">Category</span>
                    <select name="categoryId" id="category-select">
                        <option value="">Without category</option>
                    </select>
                </label>
                <label>
                    <span id="project-start-at-label">Start at</span>
                    <input type="datetime-local" name="startAt">
                </label>
                <label>
                    <span id="project-end-at-label">End at</span>
                    <input type="datetime-local" name="endAt">
                </label>
            </div>
            <div class="form-actions">
                <button class="primary-btn" type="submit">Save changes</button>
                <a class="ghost-btn" href="/author-dashboard.html">Cancel</a>
            </div>
        </form>
    </section>
    <aside class="panel tips-panel">
        <p class="panel-kicker">Editing</p>
        <h3>When editing is allowed</h3>
        <ul class="tips-list">
            <li>You can edit projects in `DRAFT` state.</li>
            <li>You can edit projects returned for revision in `REJECTED` state.</li>
            <li>After saving, you can resubmit from the author cabinet.</li>
        </ul>
    </aside>
</main>
<script src="/i18n.js"></script>
<script src="/shell.js"></script>
<script src="/edit-project-app.js"></script>
</body>
</html>
