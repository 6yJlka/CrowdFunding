<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-key="author.title">Проект | RiseUp</title>
    <link rel="icon" type="image/png" href="/assets/riseup-mark-square.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="author-layout">
<div id="site-shell"></div>
<main class="container author-workspace">
    <section class="profile-banner" id="author-profile-banner" aria-labelledby="author-name">
        <div class="profile-banner-top">
            <div class="profile-avatar" id="author-avatar"><img id="author-avatar-preview" alt="" hidden><span id="author-avatar-fallback" aria-hidden="true"></span><button class="profile-avatar-add" type="button" id="author-avatar-open" data-i18n-aria-label="profile.uploadAvatar"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M9 3v12M3 9h12"/></svg></button></div>
            <div class="profile-banner-copy"><p class="profile-membership" id="author-membership"></p><h1 id="author-name" data-i18n-key="app.loading"></h1><p class="profile-bio" id="author-bio"></p>
                <div class="profile-actions"><button class="dark-btn" type="button" id="author-bio-edit-btn"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m10 2 4 4-8 8H2v-4z"/></svg><span data-i18n-key="profile.edit"></span></button><a class="primary-btn" href="/create-project.html" data-i18n-key="author.action.newProject"></a></div>
            </div>
        </div>
        <dl class="profile-metrics" id="author-stats"></dl>
    </section>
    <section class="author-projects-section" aria-labelledby="author-projects-title">
        <div class="author-section-heading"><h2 id="author-projects-title" data-i18n-key="shell.myProjects"></h2><div class="auth-status" id="author-status" role="status"></div></div>
        <div class="author-status-tabs" id="author-status-tabs" role="tablist" data-i18n-aria-label="author.filterLabel"></div>
        <p class="author-filter-hint" id="author-filter-hint"></p>
        <div class="author-project-grid" id="author-projects" role="tabpanel" aria-live="polite" aria-busy="true"></div>
        <nav class="pagination" data-i18n-aria-label="author.pagination"><button class="pagination-btn" type="button" id="author-prev" disabled data-i18n-key="projects.prev"></button><span id="author-page-info"></span><button class="pagination-btn" type="button" id="author-next" disabled data-i18n-key="projects.next"></button></nav>
    </section>
</main>
<dialog class="modal-dialog profile-dialog" id="author-profile-dialog" aria-labelledby="profile-dialog-title">
    <div class="modal-dialog-header"><h2 id="profile-dialog-title" data-i18n-key="profile.dialogTitle"></h2><button class="modal-close" type="button" data-modal-close data-i18n-aria-label="aria.closeModal"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button></div>
    <form class="profile-edit-form" id="author-bio-form">
        <div class="profile-upload-row"><div class="profile-modal-avatar" id="profile-modal-avatar" aria-hidden="true"></div><div><button class="secondary-btn light-btn" type="button" id="author-avatar-upload" data-i18n-key="profile.uploadAvatar"></button><input type="file" id="author-avatar-input" accept="image/*" hidden><p class="field-hint" data-i18n-key="profile.avatarHint"></p></div></div>
        <div class="field"><label for="profile-name" data-i18n-key="auth.displayName"></label><input id="profile-name" type="text" disabled aria-describedby="profile-locked"></div>
        <div class="field"><label for="profile-email" data-i18n-key="auth.email"></label><input id="profile-email" type="email" disabled aria-describedby="profile-locked"><small id="profile-locked" data-i18n-key="profile.locked"></small></div>
        <div class="field"><div class="field-heading"><label for="author-bio-input" data-i18n-key="profile.bio"></label><output class="field-counter" id="author-bio-counter" for="author-bio-input">0 / 280</output></div><textarea id="author-bio-input" name="bio" rows="4" maxlength="280" required data-i18n-placeholder="profile.bioPlaceholder" aria-describedby="profile-status"></textarea></div>
        <div class="auth-status" id="profile-status" role="status"></div>
        <div class="modal-dialog-actions"><button class="primary-btn" id="author-bio-save-btn" type="submit" data-i18n-key="profile.save"></button><button class="secondary-btn" type="button" data-modal-close data-i18n-key="profile.cancel"></button></div>
    </form>
</dialog>
<script src="/i18n.js"></script>
<script src="/shell.js"></script>
<script src="/author-dashboard-app.js"></script>
</body>
</html>
