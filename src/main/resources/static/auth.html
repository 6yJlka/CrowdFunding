<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/assets/riseup-mark-square.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-key="auth.title">Вход | RiseUp</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    </head>
<body class="auth-page">
<div id="site-shell"></div>
<main class="container auth-access-layout">
    <section class="auth-showcase" aria-labelledby="auth-headline">
        <div><h1 id="auth-headline" data-i18n-key="auth.headline"></h1><p data-i18n-key="auth.introduction"></p></div>
        <div class="auth-live-stats" aria-busy="true" id="auth-live-stats">
            <div><strong id="auth-stat-campaigns">&mdash;</strong><span data-i18n-key="auth.stat.active"></span></div>
            <div><strong id="auth-stat-raised">&mdash;</strong><span data-i18n-key="auth.stat.raised"></span></div>
            <div><strong id="auth-stat-backers">&mdash;</strong><span data-i18n-key="auth.stat.backers"></span></div>
        </div>
        <p class="auth-stats-note" id="auth-stats-note" role="status" hidden></p>
    </section>
    <section class="auth-access-panel" data-i18n-aria-label="auth.accessLabel">
        <div class="auth-access-tabs" role="tablist" data-i18n-aria-label="auth.accessLabel">
            <button class="auth-tab active" id="login-tab" type="button" role="tab" aria-selected="true" aria-controls="login-form" data-tab="login" data-i18n-key="auth.tab.login"></button>
            <button class="auth-tab" id="register-tab" type="button" role="tab" aria-selected="false" aria-controls="register-form" tabindex="-1" data-tab="register" data-i18n-key="auth.tab.register"></button>
        </div>
        <p class="auth-status error" id="auth-session-notice" role="alert" hidden data-i18n-key="auth.sessionExpired"></p>
        <form class="auth-access-form" id="login-form" role="tabpanel" aria-labelledby="login-tab" aria-describedby="auth-status">
            <div class="auth-access-heading"><h2 data-i18n-key="auth.welcome"></h2><p data-i18n-key="auth.loginHint"></p></div>
            <div class="field"><label for="login-email" data-i18n-key="auth.email"></label><input id="login-email" type="email" name="email" autocomplete="username" required data-i18n-placeholder="auth.emailPlaceholder"></div>
            <div class="field"><label for="login-password" data-i18n-key="auth.password"></label><input id="login-password" type="password" name="password" autocomplete="current-password" required data-i18n-placeholder="auth.passwordPlaceholder"></div>
            <button class="primary-btn btn-lg" type="submit" data-i18n-key="auth.tab.login"></button>
            <p class="auth-access-switch"><span data-i18n-key="auth.noAccount"></span> <button type="button" class="auth-switch-link" data-auth-switch="register" data-i18n-key="auth.signUpLink"></button></p>
        </form>
        <form class="auth-access-form hidden" id="register-form" role="tabpanel" aria-labelledby="register-tab" aria-describedby="auth-status" hidden>
            <div class="auth-access-heading"><h2 data-i18n-key="auth.create"></h2><p data-i18n-key="auth.freeHint"></p></div>
            <fieldset class="auth-role-fieldset"><legend data-i18n-key="auth.whoAreYou"></legend><div class="auth-role-options" role="radiogroup" data-i18n-aria-label="auth.whoAreYou">
                <button type="button" role="radio" aria-checked="true" data-auth-role="AUTHOR"><strong data-i18n-key="auth.authorTitle"></strong><span data-i18n-key="auth.authorHint"></span></button>
                <button type="button" role="radio" aria-checked="false" tabindex="-1" data-auth-role="SPONSOR"><strong data-i18n-key="auth.sponsorTitle"></strong><span data-i18n-key="auth.sponsorHint"></span></button>
            </div><input type="hidden" name="role" value="AUTHOR"></fieldset>
            <div class="field"><div class="field-heading"><label for="register-name" data-i18n-key="auth.displayName"></label><output class="field-counter" id="auth-name-counter" for="register-name">0 / 120</output></div><input id="register-name" type="text" name="displayName" autocomplete="name" maxlength="120" required data-i18n-placeholder="auth.namePlaceholder"></div>
            <div class="field"><label for="register-email" data-i18n-key="auth.email"></label><input id="register-email" type="email" name="email" autocomplete="username" required data-i18n-placeholder="auth.emailPlaceholder"></div>
            <div class="field"><label for="register-password" data-i18n-key="auth.password"></label><input id="register-password" type="password" name="password" autocomplete="new-password" minlength="6" maxlength="100" required data-i18n-placeholder="auth.newPasswordPlaceholder" aria-describedby="auth-password-hint"><small id="auth-password-hint" data-i18n-key="auth.passwordHint"></small></div>
            <button class="primary-btn btn-lg" type="submit" data-i18n-key="auth.create"></button>
            <p class="auth-access-terms" data-i18n-key="auth.terms"></p>
        </form>
        <div class="auth-status" id="auth-status" role="status" aria-live="polite"></div>
    </section>
</main>
<script src="/i18n.js"></script>
<script src="/shell.js"></script>
<script src="/auth-app.js"></script>
</body>
</html>
