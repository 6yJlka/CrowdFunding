<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/png" href="/assets/riseup-mark-square.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Active Campaigns | CrowdFunding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body data-catalog-status="ACTIVE" data-catalog-title="Active campaigns" data-catalog-kicker="Discover" data-catalog-empty="No active campaigns found for this filter.">
<div id="site-shell"></div>
<main class="catalog-page">
    <section class="panel catalog-hero">
        <div>
            <p class="panel-kicker" id="catalog-kicker">Discover</p>
            <h1 id="catalog-title">Active campaigns</h1>
            <p class="catalog-subtitle">Search public projects, narrow them by category and move into full project pages.</p>
        </div>
        <div class="catalog-hero-actions">
            <a class="ghost-btn" href="/">Back to dashboard</a>
            <a class="primary-btn" href="/auth.html" id="create-campaign-link">Create campaign</a>
        </div>
    </section>

    <section class="panel catalog-browser-panel">
        <div class="catalog-toolbar">
            <label class="compact-search">
                <input type="search" id="catalog-page-search" placeholder="Search by project title">
            </label>
            <select id="catalog-category-filter">
                <option value="">All categories</option>
            </select>
            <select id="catalog-sort-filter">
                <option value="createdAt,desc">Newest first</option>
                <option value="collectedAmount,desc">Most funded</option>
                <option value="goalAmount,desc">Highest goal</option>
                <option value="title,asc">Title A-Z</option>
            </select>
            <button class="dark-btn" type="button" id="catalog-page-search-btn">Search</button>
        </div>
        <div class="catalog-chip-row" id="catalog-chip-row"></div>
        <div class="auth-status" id="catalog-page-status"></div>
        <div class="project-grid" id="catalog-page-grid"></div>
        <div class="catalog-pagination">
            <button class="ghost-btn" type="button" id="catalog-prev-btn">Previous</button>
            <span class="catalog-pagination-copy" id="catalog-pagination-copy">Page 1</span>
            <button class="ghost-btn" type="button" id="catalog-next-btn">Next</button>
        </div>
    </section>
</main>

<div class="modal hidden" id="project-modal">
    <div class="modal-backdrop" id="modal-backdrop"></div>
    <section class="modal-card">
        <button class="modal-close" type="button" id="modal-close" data-i18n-aria="aria.closeModal">x</button>
        <div class="modal-body" id="modal-body">
            <p class="panel-kicker">Project</p>
            <h3>Select a campaign</h3>
            <p>Details will appear here.</p>
        </div>
    </section>
</div>
<script src="/i18n.js"></script>
<script src="/shell.js"></script>
<script src="/catalog-browser-app.js"></script>
</body>
</html>
