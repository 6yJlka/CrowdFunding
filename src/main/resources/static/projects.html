<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-key="catalog.title">Каталог проектов | RiseUp</title>
    <link rel="icon" type="image/png" href="/assets/riseup-mark-square.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="catalog-layout">
<div id="site-shell"></div>
<main class="container public-catalog">
    <header class="public-catalog-header">
        <h1 data-i18n-key="catalog.heading">Каталог проектов</h1>
        <div class="public-catalog-tools">
            <form class="public-catalog-search" id="catalog-search-form" role="search">
                <label class="sr-only" for="catalog-page-search" data-i18n-key="catalog.searchLabel">Найти проект по названию</label>
                <input type="search" id="catalog-page-search" data-i18n-placeholder="catalog.searchLabel" placeholder="Найти проект по названию">
                <button class="primary-btn" type="submit" id="catalog-page-search-btn" data-i18n-key="projects.search">Поиск</button>
            </form>
            <div class="public-catalog-sort">
                <span class="sr-only" id="catalog-sort-label" data-i18n-key="catalog.sortLabel">Сортировка</span>
                <button class="public-catalog-sort-trigger" id="catalog-sort-filter" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="catalog-sort-listbox" aria-labelledby="catalog-sort-label catalog-sort-value">
                    <span id="catalog-sort-value">Сначала новые</span>
                    <span class="public-catalog-sort-arrow" aria-hidden="true"><svg width="14" height="14" viewBox="0 0 14 14"><path d="M3 5l4 4 4-4" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                </button>
                <ul class="public-catalog-sort-menu" id="catalog-sort-listbox" role="listbox" tabindex="-1" aria-labelledby="catalog-sort-label" hidden>
                    <li class="public-catalog-sort-option" id="catalog-sort-newest" role="option" aria-selected="true" data-sort-value="createdAt,desc"><span data-i18n-key="projects.sort.newest">Сначала новые</span><svg class="public-catalog-sort-check" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="m3 9 4 4 8-8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></li>
                    <li class="public-catalog-sort-option" id="catalog-sort-funded" role="option" aria-selected="false" data-sort-value="collectedAmount,desc"><span data-i18n-key="projects.sort.funded">Больше собрано</span><svg class="public-catalog-sort-check" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="m3 9 4 4 8-8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></li>
                    <li class="public-catalog-sort-option" id="catalog-sort-goal" role="option" aria-selected="false" data-sort-value="goalAmount,desc"><span data-i18n-key="projects.sort.goal">Самая высокая цель</span><svg class="public-catalog-sort-check" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="m3 9 4 4 8-8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></li>
                    <li class="public-catalog-sort-option" id="catalog-sort-title" role="option" aria-selected="false" data-sort-value="title,asc"><span data-i18n-key="projects.sort.az">Название А–Я</span><svg class="public-catalog-sort-check" width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="m3 9 4 4 8-8" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></li>
                </ul>
            </div>
        </div>
        <div class="segments" id="catalog-status-tabs" role="tablist" data-i18n-aria-label="catalog.statusLabel" aria-label="Статус сбора">
            <button class="segment" id="catalog-tab-active" type="button" role="tab" aria-selected="true" aria-controls="catalog-results" data-catalog-status="ACTIVE" data-i18n-key="catalog.status.active">Идёт сбор</button>
            <button class="segment" id="catalog-tab-funded" type="button" role="tab" aria-selected="false" aria-controls="catalog-results" tabindex="-1" data-catalog-status="FUNDED" data-i18n-key="catalog.status.funded">Профинансированы</button>
        </div>
        <div class="chips" id="catalog-chip-row" role="group" data-i18n-aria-label="catalog.categoriesLabel" aria-label="Категории"></div>
        <p class="public-catalog-count" id="catalog-result-count" role="status"></p>
        <p class="page-message" id="catalog-page-status" role="status" hidden></p>
    </header>
    <section id="catalog-results" role="tabpanel" aria-labelledby="catalog-tab-active" tabindex="0">
        <div class="public-project-grid" id="catalog-page-grid" aria-busy="true"></div>
    </section>
    <nav class="pagination" data-i18n-aria-label="catalog.paginationLabel" aria-label="Страницы каталога">
        <button class="secondary-btn" type="button" id="catalog-prev-btn" disabled data-i18n-key="projects.prev">Назад</button>
        <span class="pagination-label" id="catalog-pagination-copy" aria-live="polite"></span>
        <button class="secondary-btn" type="button" id="catalog-next-btn" disabled data-i18n-key="projects.next">Вперёд</button>
    </nav>
</main>
<script src="/i18n.js"></script>
<script src="/shell.js"></script>
<script src="/catalog-browser-app.js"></script>
</body>
</html>
