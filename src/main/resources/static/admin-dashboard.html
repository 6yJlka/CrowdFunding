<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moderation | CrowdFunding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
<div id="site-shell"></div>
<main class="create-layout">
    <section class="panel form-panel">
        <div class="panel-header">
            <div>
                <p class="panel-kicker">Admin Area</p>
                <h3>Moderation queue</h3>
            </div>
            <a class="ghost-btn" href="/">Dashboard</a>
        </div>
        <div class="auth-status" id="admin-status"></div>
        <div class="author-projects" id="admin-projects"></div>
        <div class="catalog-pagination">
            <button class="ghost-btn" type="button" id="admin-projects-prev-btn">Previous</button>
            <span class="catalog-pagination-copy" id="admin-projects-pagination-copy">Page 1</span>
            <button class="ghost-btn" type="button" id="admin-projects-next-btn">Next</button>
        </div>

        <div class="panel-header admin-subsection">
            <div>
                <p class="panel-kicker">Users</p>
                <h3>User management</h3>
            </div>
        </div>
        <div class="catalog-toolbar admin-toolbar">
            <label class="compact-search">
                <input type="search" id="admin-users-search" placeholder="Search by email or name">
            </label>
            <label class="admin-filter">
                <select id="admin-users-status-filter">
                    <option value="">All users</option>
                    <option value="ACTIVE">Active</option>
                    <option value="BLOCKED">Blocked</option>
                </select>
            </label>
            <button class="dark-btn" type="button" id="admin-users-search-btn">Search</button>
        </div>
        <div class="auth-status" id="admin-users-status"></div>
        <div class="author-projects" id="admin-users"></div>
        <div class="catalog-pagination">
            <button class="ghost-btn" type="button" id="admin-users-prev-btn">Previous</button>
            <span class="catalog-pagination-copy" id="admin-users-pagination-copy">Page 1</span>
            <button class="ghost-btn" type="button" id="admin-users-next-btn">Next</button>
        </div>
    </section>
    <aside class="panel tips-panel">
        <p class="panel-kicker">Actions</p>
        <h3>Moderation flow</h3>
        <ul class="tips-list">
            <li>Approve moves project to `ACTIVE`.</li>
            <li>Reject moves project to `REJECTED`.</li>
            <li>Queue shows projects in `MODERATION` by default.</li>
            <li>User management lets admin change role and status.</li>
        </ul>
    </aside>
</main>
<script src="/shell.js"></script>
<script src="/admin-dashboard-app.js"></script>
</body>
</html>
