<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-key="admin.title">Модерация | RiseUp</title>
    <link rel="icon" type="image/png" href="/assets/riseup-mark-square.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="admin-dashboard-page">
<div id="site-shell"></div>
<main class="container moderation-workspace">
<header class="moderation-page-heading"><div><h1 data-i18n-key="shell.moderation"></h1></div><div class="workspace-tabs" role="tablist" data-i18n-aria-label="moderation.tabsLabel"><button type="button" role="tab" id="admin-tab-queue" aria-controls="admin-panel-queue" aria-selected="true" tabindex="0" data-admin-tab="queue" data-i18n-key="moderation.tab.queue"></button><button type="button" role="tab" id="admin-tab-users" aria-controls="admin-panel-users" aria-selected="false" tabindex="-1" data-admin-tab="users" data-i18n-key="moderation.tab.users"></button><button type="button" role="tab" id="admin-tab-comments" aria-controls="admin-panel-comments" aria-selected="false" tabindex="-1" data-admin-tab="comments" data-i18n-key="moderation.tab.comments"></button></div></header>
<section id="admin-panel-queue" class="admin-tab-panel" role="tabpanel" aria-labelledby="admin-tab-queue">
<div class="admin-queue-layout" id="admin-queue-layout"><div class="admin-queue-sidebar"><p class="admin-queue-count" id="admin-queue-count" role="status"></p><div class="admin-queue-list" id="admin-projects" aria-busy="true"></div><nav class="pagination admin-pagination" data-i18n-aria-label="moderation.pagination"><button class="secondary-btn" type="button" id="admin-projects-prev-btn" disabled data-i18n-key="projects.prev"></button><span id="admin-projects-pagination-copy"></span><button class="secondary-btn" type="button" id="admin-projects-next-btn" disabled data-i18n-key="projects.next"></button></nav></div><div id="admin-queue-detail" aria-busy="true"></div></div></section>
<section id="admin-panel-users" class="admin-tab-panel" role="tabpanel" aria-labelledby="admin-tab-users" hidden>
<div class="admin-search-toolbar"><div class="field"><label class="sr-label" for="admin-users-search" data-i18n-key="moderation.userSearch"></label><input id="admin-users-search" type="search" data-i18n-placeholder="moderation.userSearchPlaceholder"></div><div class="field"><label class="sr-label" for="admin-users-status-filter" data-i18n-key="admin.status"></label><select id="admin-users-status-filter"><option value="" data-i18n-key="admin.filter.allUsers"></option><option value="ACTIVE" data-i18n-key="admin.filter.active"></option><option value="BLOCKED" data-i18n-key="admin.filter.blocked"></option><option value="DELETED" data-i18n-key="admin.status.deleted"></option></select></div><button type="button" class="secondary-btn" id="admin-users-search-btn" data-i18n-key="moderation.search"></button></div>
<div class="admin-users-table-wrap"><table class="admin-users-table"><thead><tr><th scope="col" data-i18n-key="admin.user"></th><th scope="col" data-i18n-key="admin.role"></th><th scope="col" data-i18n-key="admin.status"></th><th scope="col" data-i18n-key="moderation.action"></th></tr></thead><tbody id="admin-users" aria-busy="true"></tbody></table></div><nav class="pagination admin-pagination" data-i18n-aria-label="moderation.pagination"><button class="secondary-btn" type="button" id="admin-users-prev-btn" disabled data-i18n-key="projects.prev"></button><span id="admin-users-pagination-copy"></span><button class="secondary-btn" type="button" id="admin-users-next-btn" disabled data-i18n-key="projects.next"></button></nav><p class="admin-help" data-i18n-key="moderation.softDelete"></p></section>
<section id="admin-panel-comments" class="admin-tab-panel" role="tabpanel" aria-labelledby="admin-tab-comments" hidden>
<div class="admin-search-toolbar"><div class="field"><label class="sr-label" for="admin-comments-search" data-i18n-key="moderation.commentSearch"></label><input type="search" id="admin-comments-search" data-i18n-placeholder="moderation.commentSearchPlaceholder"></div><button type="button" class="secondary-btn" id="admin-comments-search-btn" data-i18n-key="moderation.search"></button></div><div class="admin-comment-list" id="admin-comments" aria-busy="true"></div><nav class="pagination admin-pagination" data-i18n-aria-label="moderation.pagination"><button class="secondary-btn" type="button" id="admin-comments-prev-btn" disabled data-i18n-key="projects.prev"></button><span id="admin-comments-pagination-copy"></span><button class="secondary-btn" type="button" id="admin-comments-next-btn" disabled data-i18n-key="projects.next"></button></nav></section>
</main>
<script src="/i18n.js"></script>
<script src="/shell.js"></script>
<script src="/admin-dashboard-app.js"></script>
</body>
</html>
