<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n-key="showcase.analytics.title">Аналитика | RiseUp</title>
    <link rel="icon" type="image/png" href="/assets/riseup-mark-square.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&amp;family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body class="analytics-page">
<div id="site-shell"></div>
<main class="container analytics-workspace"><header class="analytics-page-heading"><h1 data-i18n-key="shell.analytics"></h1></header><dl class="analytics-metrics" id="analytics-metrics" aria-busy="true"><div><dd id="analytics-total-raised">&mdash;</dd><dt data-i18n-key="analytics.raised"></dt></div><div><dd id="analytics-active-projects">&mdash;</dd><dt id="analytics-active-label"></dt></div><div><dd id="analytics-funded-projects">&mdash;</dd><dt id="analytics-funded-label"></dt></div><div><dd id="analytics-total-backers">&mdash;</dd><dt id="analytics-backers-label"></dt></div></dl><p class="page-message" id="analytics-status" role="status" hidden></p>
<figure class="analytics-growth"><figcaption><h2 id="analytics-chart-title" data-i18n-key="analytics.growth"></h2><p data-i18n-key="analytics.chartCaption"></p></figcaption><div class="analytics-chart-plot" id="analytics-chart-plot"><div class="analytics-chart-axis" aria-hidden="true" id="analytics-chart-axis"></div><div class="analytics-chart-body"><svg class="analytics-growth-svg" id="analytics-chart" viewBox="0 0 1000 272" preserveAspectRatio="none" role="img" aria-labelledby="analytics-chart-title analytics-chart-description"><desc id="analytics-chart-description"></desc><g class="analytics-chart-grid" aria-hidden="true"><line x1="0" y1="8" x2="1000" y2="8"/><line x1="0" y1="93" x2="1000" y2="93"/><line x1="0" y1="178" x2="1000" y2="178"/><line x1="0" y1="264" x2="1000" y2="264"/></g><path id="chart-area-path" class="analytics-growth-area"/><path id="chart-line-path" class="analytics-growth-line"/><circle id="analytics-chart-point" r="5" class="analytics-growth-point"/></svg><div class="analytics-chart-labels" id="chart-months" aria-hidden="true"></div></div></div><p class="empty-state" id="analytics-chart-empty" hidden data-i18n-key="analytics.noChart"></p></figure>
<section class="analytics-top-section" aria-labelledby="analytics-top-title"><div class="analytics-section-heading"><h2 id="analytics-top-title" data-i18n-key="analytics.top"></h2><div class="workspace-tabs" role="tablist" data-i18n-aria-label="analytics.periodLabel"><button type="button" role="tab" id="analytics-period-all" data-filter="all" aria-controls="analytics-top-projects" aria-selected="true" tabindex="0" data-i18n-key="analytics.period.all"></button><button type="button" role="tab" id="analytics-period-year" data-filter="year" aria-controls="analytics-top-projects" aria-selected="false" tabindex="-1" data-i18n-key="analytics.period.year"></button><button type="button" role="tab" id="analytics-period-month" data-filter="month" aria-controls="analytics-top-projects" aria-selected="false" tabindex="-1" data-i18n-key="analytics.period.month"></button></div></div><ol class="analytics-ranking" id="analytics-top-projects" role="tabpanel" aria-labelledby="analytics-period-all" aria-busy="true"></ol><p class="analytics-period-note" id="analytics-period-note"></p></section>
<section class="analytics-people"><div class="analytics-founders-panel"><h2 data-i18n-key="analytics.newAuthors"></h2><div class="analytics-founder-grid" id="analytics-founders"></div></div><div class="analytics-sponsors-panel"><h2 data-i18n-key="analytics.newSponsors"></h2><ul class="analytics-sponsor-list" id="analytics-sponsors"></ul></div></section></main>
<script src="/i18n.js"></script>
<script src="/shell.js"></script>
<script src="/analytics-app.js"></script>
</body>
</html>
